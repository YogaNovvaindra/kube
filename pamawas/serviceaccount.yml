apiVersion: v1
kind: ServiceAccount
metadata:
  name: pamawas
  namespace: pamawas
  labels:
    app.kubernetes.io/name: pamawas
    app.kubernetes.io/part-of: pamawas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pamawas
  namespace: pamawas
  labels:
    app.kubernetes.io/name: pamawas
    app.kubernetes.io/part-of: pamawas
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - pods
      - services
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pamawas
  namespace: pamawas
  labels:
    app.kubernetes.io/name: pamawas
    app.kubernetes.io/part-of: pamawas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pamawas
subjects:
  - kind: ServiceAccount
    name: pamawas
    namespace: pamawas