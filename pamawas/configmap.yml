apiVersion: v1
kind: ConfigMap
metadata:
  name: pamawas-config
  namespace: pamawas
  labels:
    app.kubernetes.io/name: pamawas
    app.kubernetes.io/part-of: pamawas
data:
  # Common configuration
  PORT: "8080"
  LOG_LEVEL: "info"
  ENVIRONMENT: "production"
  OTEL_EXPORTER_OTLP_ENDPOINT: "tempo.monitoring.svc.cluster.local:4317"

  # Correlator
  CORRELATION_TIME_WINDOW: "10m"
  CORRELATION_INTERVAL: "1m"
  CORRELATOR_MODE: "auto"
  FLAPPING_COOLDOWN_WINDOW: "15m"
  INVESTIGATOR_URL: "http://pamawas-investigator:8080"

  # Scheduler
  REPORTER_URL: "http://pamawas-reporter:8080"
  DAILY_REPORT_TIME: "07:00"
  # Single source of truth for alert severity gating. Consumed by ingest
  # (event-driven alert forwarding), reporter (authoritative re-check) and
  # scheduler (follow-up report eligibility). "high" => high + critical.
  # "unknown" is the absence of a gate: it ranks below every real severity, so
  # every alert passes through to an investigation and a report. Use it when all
  # alerts must be recorded, not just the ones that would page.
  HIGH_SEVERITY_THRESHOLD: "unknown"
  CHECK_INTERVAL: "30s"
  ENABLE_DAILY_REPORT: "true"
  ENABLE_HIGH_SEVERITY_ALERT: "true"
  SCHEDULER_MODE: "auto"
  # Stale incident verification (scheduler sweep + anti-flood back-off).
  ENABLE_STALE_VERIFICATION: "true"
  INCIDENT_STALE_AFTER: "6h"
  STALE_REVERIFY_BASE_BACKOFF: "1h"
  STALE_REVERIFY_MAX_BACKOFF: "24h"

  # Stalled delivery recovery. The scheduler calls the reporter's
  # /api/v1/retry-stalled-deliveries on this interval to reclaim delivery
  # attempts whose lease expired mid-send. One hour is deliberately slow:
  # a leaked lease is rare, and each call mutates every expired row.
  ENABLE_STALLED_DELIVERY_RECOVERY: "true"
  STALLED_DELIVERY_RECOVERY_INTERVAL: "1h"

  # Inbound HTTP rate limiting (per route; probes and /metrics exempt).
  # Webhook routes get a higher budget: alert floods are the expected shape.
  RATE_LIMIT_RPS: "10"
  RATE_LIMIT_BURST: "20"
  WEBHOOK_RATE_LIMIT_RPS: "50"
  WEBHOOK_RATE_LIMIT_BURST: "100"

  # Correlator outbox delivery retry budget. On exhaustion the row is copied
  # to investigation_outbox_dead_letter and marked failed_terminal.
  OUTBOX_MAX_ATTEMPTS: "20"

  # Investigator background retry scheduler cadence.
  RETRY_SCHEDULER_TICK_SECONDS: "60"

  # OpenTelemetry sampling (fraction of traces kept). Probes and scrapes are
  # not traced at all, so what remains is incident traffic: webhooks, outbox
  # deliveries, report generation. That volume is low enough to keep every
  # trace, and dropping 9 in 10 was what made "the trace is missing" a normal
  # outcome when debugging a report that never arrived.
  OTEL_SAMPLE_RATIO: "1.0"

  # Reporter reports are generated from scheduler-created requests.
  AVAILABILITY_METRIC: "up"
  REPORT_TEMPLATE: "v2"
  # Cap on the reporter's daily-summary call to the investigator. The digest is
  # delivered on time without the summary if the model is slow.
  SUMMARY_TIMEOUT: "300s"

  # Investigator
  LLM_BASE_URLS: "https://freellmapi.ygnv.my.id/v1,https://integrate.api.nvidia.com/v1"
  LLM_MODELS: "auto,poolside/laguna-xs-2.1"
  # Prometheus/Loki for evidence enrichment (investigator only)
  PROMETHEUS_URL: "http://prometheus.monitoring.svc.cluster.local:9090"
  # Label carrying the service name, used to build enrichment selectors.
  # Neither Prometheus nor Loki has an "incident" label.
  PROMETHEUS_SERVICE_LABEL: "service"
  PROMETHEUS_TIMEOUT_SECONDS: "60"
  LOKI_URL: "http://loki.monitoring.svc.cluster.local:3100"
  LOKI_SERVICE_LABEL: "kubernetes_container_name"
  LOKI_TIMEOUT_SECONDS: "60"
  LOKI_MAX_LOG_LINES: "100"
  # Authoritative alert-condition state. Recovery remains inconclusive until
  # GRAFANA_API_TOKEN exists in the pamawas-secrets SealedSecret.
  GRAFANA_URL: "http://grafana.monitoring.svc.cluster.local:3000"
  GRAFANA_ORG_ID: "1"
  GRAFANA_TIMEOUT_SECONDS: "10"
  # Turns per investigation. A run that has made this many LLM calls without
  # converging is not going to; the old value of 100 let a run burn the whole
  # wall-clock budget and still submit nothing.
  MAX_TOOL_CALLS: "50"
  # Wall-clock budget per investigation. The last quarter of it (at least 90s)
  # is reserved for writing findings, so evidence gathered is not discarded
  # when the budget runs out. The previous default was 600s.
  INVESTIGATION_TIMEOUT_SECONDS: "600"
  # Floor for a single LLM request, in seconds. It is a floor, not a cap: each
  # attempt gets a share of the remaining investigation budget, up to 180s, so a
  # slow endpoint is allowed to finish. This used to be a hard 30s cap, which
  # cut off every free-endpoint response mid-generation and produced runs that
  # timed out six times in a row and submitted nothing.
  LLM_REQUEST_TIMEOUT_SECONDS: "60"
  # Stale-incident verification budget. When an incident is silent past
  # INCIDENT_STALE_AFTER, the correlator asks the investigator whether the
  # condition is still down. A verification answers one question, so it is
  # bounded far below a full investigation.
  VERIFY_TOOL_CALLS: "20"
  VERIFY_TIMEOUT_SECONDS: "300"
  # How many investigations may call the LLM at once. The LLM endpoint is the
  # scarce resource — a free endpoint serves a handful of concurrent requests,
  # so an unbounded burst turns every run into a timeout. Investigations beyond
  # this limit wait in the `queued` state and are claimed by a worker.
  MAX_CONCURRENT_INVESTIGATIONS: "2"
