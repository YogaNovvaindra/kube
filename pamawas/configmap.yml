apiVersion: v1
kind: ConfigMap
metadata:
  name: pamawas-config
  namespace: pamawas
  labels:
    app.kubernetes.io/name: pamawas
    app.kubernetes.io/part-of: pamawas
data:
  # Common configuration
  PORT: "8080"
  LOG_LEVEL: "info"
  ENVIRONMENT: "production"
  OTEL_EXPORTER_OTLP_ENDPOINT: "tempo.monitoring.svc.cluster.local:4317"

  # Correlator
  CORRELATION_TIME_WINDOW: "10m"
  CORRELATION_INTERVAL: "1m"
  CORRELATOR_MODE: "auto"
  INVESTIGATOR_URL: "http://pamawas-investigator:8080"

  # Scheduler
  REPORTER_URL: "http://pamawas-reporter:8080"
  DAILY_REPORT_TIME: "07:00"
  HIGH_SEVERITY_THRESHOLD: "high"
  CHECK_INTERVAL: "30s"
  ENABLE_DAILY_REPORT: "true"
  ENABLE_HIGH_SEVERITY_ALERT: "true"
  SCHEDULER_MODE: "auto"

  # Reporter
  # Report interval adjusted - investigator now handles evidence enrichment
  # Daily reports triggered by scheduler at DAILY_REPORT_TIME (07:00)
  REPORTER_MODE: "auto"

  # Investigator
  LLM_BASE_URL: "https://integrate.api.nvidia.com/v1"
  LLM_MODEL: "nvidia/nemotron-3-ultra-550b-a55b"
  # Prometheus/Loki for evidence enrichment (investigator only)
  PROMETHEUS_URL: "http://prometheus.monitoring.svc.cluster.local:9090"
  PROMETHEUS_QUERY_TEMPLATE: '{incident="%s"}'
  PROMETHEUS_TIMEOUT_SECONDS: "30"
  LOKI_URL: "http://loki.monitoring.svc.cluster.local:3100"
  LOKI_QUERY_TEMPLATE: '{incident="%s"}'
  LOKI_TIMEOUT_SECONDS: "30"
  LOKI_MAX_LOG_LINES: "100"
  MAX_TOOL_CALLS: "6"