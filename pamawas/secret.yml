apiVersion: v1
kind: Secret
metadata:
  name: pamawas-secrets
  namespace: pamawas
  labels:
    app.kubernetes.io/name: pamawas
    app.kubernetes.io/part-of: pamawas
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgres://pamawas:***@postgresql.example.com:5432/pamawas?sslmode=disable"

  # Delivery (reporter)
  DISCORD_WEBHOOK_URL: ""
  TELEGRAM_BOT_TOKEN: ""
  TELEGRAM_CHAT_ID: ""
  EMAIL_SMTP_HOST: ""
  EMAIL_SMTP_PORT: "587"
  EMAIL_USERNAME: ""
  EMAIL_PASSWORD: ""
  EMAIL_FROM: ""
  EMAIL_TO: ""

  # LLM (investigator)
  LLM_API_KEY: "your_openai_api_key_here"

  # Optional: custom report template
  REPORT_TEMPLATE: ""