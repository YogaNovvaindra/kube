apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-snapshot-config
  namespace: immich
data:
  pg-snapshot.sh: |
    #!/bin/sh
    set -euo pipefail

    # Ensure curl is installed for Discord notifications
    if ! command -v curl >/dev/null 2>&1; then
      if command -v apt-get >/dev/null 2>&1; then
        apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates -qq
      elif command -v apk >/dev/null 2>&1; then
        apk add --no-cache curl ca-certificates
      fi
    fi

    # Discord notification helper
    discord_notify() {
      local status="$1"
      local title="$2"
      local description="$3"
      local color=$([ "$status" = "SUCCESS" ] && echo 3066993 || echo 15158332)
      curl -sSL -H "Content-Type: application/json" \
        -X POST "$DISCORD_WEBHOOK_URL" \
        -d "{\"embeds\":[{\"title\":\"$title\",\"description\":\"$description\",\"color\":$color}]}"
    }

    PGUSER=$(cat /etc/creds/username)
    PGPASSWORD=$(cat /etc/creds/password)
    TS_INIT=$(date +"%Y-%m-%d %H:%M:%S")
    TIMESTAMP=$(date +%Y%m%d%H%M%S)
    OUTDIR="/snapshots/postgres-backup-${TIMESTAMP}"

    discord_notify "SUCCESS" "🔔 Backup Starting" \
      "**Host:** ${HOSTNAME}\n**Time:** ${TS_INIT}\n**Action:** Starting pg_basebackup snapshot"

    mkdir -p "$OUTDIR"

    if ! PGPASSWORD="$PGPASSWORD" pg_basebackup \
      -h immich-db \
      -p 5432 \
      -U "$PGUSER" \
      --pgdata="$OUTDIR" \
      --format=tar \
      --compress=9 \
      --wal-method=stream \
      --checkpoint=fast \
      --progress \
      --verbose; then
      TS_FAIL=$(date +"%Y-%m-%d %H:%M:%S")
      discord_notify "FAILED" "🚨 Backup FAILED" \
        "**Host:** ${HOSTNAME}\n**Time:** ${TS_FAIL}\n**Error:** pg_basebackup failed — check pod logs"
      exit 1
    fi

    # Cleanup old backups (keep 7 days)
    find /snapshots -maxdepth 1 -type d -name 'postgres-backup-*' -mtime +7 -exec rm -rf {} +

    TS_END=$(date +"%Y-%m-%d %H:%M:%S")
    DURATION=$(( $(date +%s) - $(date -d "$TS_INIT" +%s) ))
    BASE_SIZE=$(du -h "${OUTDIR}/base.tar.gz" 2>/dev/null | cut -f1 || echo "n/a")
    WAL_SIZE=$(du -h "${OUTDIR}/pg_wal.tar.gz" 2>/dev/null | cut -f1 || echo "n/a")

    SUMMARY="**Host:** ${HOSTNAME}\n**Time:** ${TS_END}\n"
    SUMMARY="${SUMMARY}**Duration:** ${DURATION}s\n"
    SUMMARY="${SUMMARY}**base.tar.gz:** ${BASE_SIZE}\n"
    SUMMARY="${SUMMARY}**pg_wal.tar.gz:** ${WAL_SIZE}"

    discord_notify "SUCCESS" "✅ Backup Succeeded" "$SUMMARY"
    echo "✅ Backup completed: $OUTDIR"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-pg-snapshots
  namespace: immich
spec:
  schedule: "30 0 * * *" # Daily at 00:30
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      # ttlSecondsAfterFinished: 600
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
            - name: postgres-snapshotter
              image: reg.ygnv.my.id/ghcr/immich-app/postgres:16-vectorchord0.4.2-pgvectors0.3.0
              imagePullPolicy: IfNotPresent
              env:
                - name: DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: discord-cred
                      key: DISCORD_URL
              command: ["/bin/sh", "/scripts/pg-snapshot.sh"]
              volumeMounts:
                - name: localtime
                  mountPath: /etc/localtime
                  readOnly: true
                - name: pg-snapshots
                  mountPath: /snapshots
                - name: pg-snapshot-config
                  mountPath: /scripts
                - name: db-creds
                  mountPath: /etc/creds
                  readOnly: true
          volumes:
            - name: localtime
              hostPath:
                path: /etc/localtime
                type: File
            - name: pg-snapshot-config
              configMap:
                name: pg-snapshot-config
                defaultMode: 0744
            - name: pg-snapshots
              persistentVolumeClaim:
                claimName: immich-postgres-backup-pvc
            - name: db-creds
              secret:
                secretName: db-cred
                items:
                  - key: username
                    path: username
                  - key: password
                    path: password
          restartPolicy: Never
