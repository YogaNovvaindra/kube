apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-env
  namespace: monitoring
data:
  GF_SERVER_ROOT_URL: "https://grafana.ygnv.my.id/"
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  GF_AUTH_GENERIC_OAUTH_NAME: "authentik"
  GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://auth.ygnv.my.id/application/o/authorize/"
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://auth.ygnv.my.id/application/o/token/"
  GF_AUTH_GENERIC_OAUTH_API_URL: "https://auth.ygnv.my.id/application/o/userinfo/"
  GF_AUTH_SIGNOUT_REDIRECT_URL: "https://auth.ygnv.my.id/application/o/grafana/end-session/"
  GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'"
  GF_RENDERING_SERVER_URL: "http://localhost:8081/render"
  GF_RENDERING_CALLBACK_URL: "http://localhost:3000/"
  GF_DATABASE_TYPE: "postgres"
  GF_DATABASE_HOST: "postgres.db.svc.cluster.local:5432"
  GF_DATABASE_NAME: "grafana"
  GF_DATABASE_SSL_MODE: "disable"
  GF_UNIFIED_ALERTING_HA_PEERS: "grafana-headless.monitoring.svc.cluster.local:9094"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: grafana
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: reg.ygnv.my.id/docker/grafana/grafana:13.3.2
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: 256Mi
          ports:
            - name: http
              containerPort: 3000
            - name: ha-tcp
              containerPort: 9094
              protocol: TCP
            - name: ha-udp
              containerPort: 9094
              protocol: UDP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GF_UNIFIED_ALERTING_HA_LISTEN_ADDRESS
              value: "$(POD_IP):9094"
            - name: GF_UNIFIED_ALERTING_HA_ADVERTISE_ADDRESS
              value: "$(POD_IP):9094"
          envFrom:
            - configMapRef:
                name: grafana-env
            - secretRef:
                name: grafana-cred
            - secretRef:
                name: grafana-db-cred
            - secretRef:
                name: grafana-harbor-db-cred
                optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-alerts
              mountPath: /etc/grafana/provisioning/alerting
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-search-index
              mountPath: /var/lib/grafana/unified-search
        - name: renderer
          image: reg.ygnv.my.id/docker/grafana/grafana-image-renderer:v5.12.12
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-cred
                  key: GF_RENDERING_RENDERER_TOKEN
            - name: BROWSER_WS_URL_READ_TIMEOUT
              value: "60s"
            - name: BROWSER_FLAGS
              value: "--disable-dev-shm-usage"
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-alerts
          projected:
            sources:
              - configMap:
                  name: grafana-alerts-nodes
                  items:
                    - key: alerts-nodes.yaml
                      path: alerts-nodes.yaml
              - configMap:
                  name: grafana-alerts-network
                  items:
                    - key: alerts-network.yaml
                      path: alerts-network.yaml
              - configMap:
                  name: grafana-alerts-ceph
                  items:
                    - key: alerts-ceph.yaml
                      path: alerts-ceph.yaml
              - configMap:
                  name: grafana-alerts-kube
                  items:
                    - key: alerts-kube.yaml
                      path: alerts-kube.yaml
              - configMap:
                  name: grafana-alerts-services
                  items:
                    - key: alerts-services.yaml
                      path: alerts-services.yaml
              - configMap:
                  name: grafana-alerts-databases
                  items:
                    - key: alerts-databases.yaml
                      path: alerts-databases.yaml
              - configMap:
                  name: grafana-alerts-proxmox
                  items:
                    - key: alerts-proxmox.yaml
                      path: alerts-proxmox.yaml
              - configMap:
                  name: grafana-alerts-templates
                  items:
                    - key: alerts-templates.yaml
                      path: alerts-templates.yaml
              - secret:
                  name: grafana-alerts-contact-points
                  items:
                    - key: alerts-pamawas-contactpoints.yaml
                      path: alerts-pamawas-contactpoints.yaml
              - secret:
                  name: grafana-alerts-contact-points
                  items:
                    - key: alerts-contact-points.yaml
                      path: alerts-contact-points.yaml
              - configMap:
                  name: grafana-alerts-policies
                  items:
                    - key: alerts-policies.yaml
                      path: alerts-policies.yaml
        - name: grafana-data
          hostPath:
            path: /mnt/cephfs/docker/monitoring/grafana
            type: Directory
        - name: grafana-search-index
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-headless
  namespace: monitoring
  labels:
    app: grafana
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: grafana
  ports:
    - name: ha-tcp
      port: 9094
      targetPort: 9094
      protocol: TCP
    - name: ha-udp
      port: 9094
      targetPort: 9094
      protocol: UDP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - http
    - https
  routes:
    - match: Host(`grafana.ygnv.my.id`)
      kind: Rule
      services:
        - name: grafana
          port: 3000
  tls: {}
