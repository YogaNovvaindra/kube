apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-policies
  namespace: monitoring
data:
  alerts-policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: discord-notification
        group_by: ['domain', 'component', 'cluster', 'severity']
        group_wait: 30s
        group_interval: 10m
        repeat_interval: 12h
        routes:
          - receiver: pamawas-ingest
            matchers:
              - actionable = true
            group_wait: 30s
            group_interval: 10m
            repeat_interval: 4h
            continue: true
          - receiver: discord-notification
            matchers:
              - severity = critical
            group_wait: 10s
            group_interval: 5m
            repeat_interval: 1h
          - receiver: discord-notification
            matchers:
              - severity = warning
            group_wait: 1m
            group_interval: 10m
            repeat_interval: 6h
          - receiver: discord-notification
            matchers:
              - severity = info
            group_wait: 5m
            group_interval: 30m
            repeat_interval: 24h
