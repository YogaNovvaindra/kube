apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-policies
  namespace: monitoring
data:
  alerts-policies.yaml: |
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: discord-notification
        group_by: ['grafana_folder', 'alertname', 'instance']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
