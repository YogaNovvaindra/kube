apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-services
  namespace: monitoring
data:
  alerts-services.yaml: |
    apiVersion: 1
    groups:
    - orgId: 1
      name: Monitoring Availability
      folder: Infrastructure
      interval: 2m
      rules:
      - uid: target_down
        title: Prometheus Target Down
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            expr: up
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: mean
            refId: B
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
            conditions:
            - evaluator:
                params:
                - 0.5
                type: lt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
        for: 5m
        annotations:
          summary: 'Target Down: {{ $labels.job }}'
          description: 'Monitoring target {{ $labels.instance }} (job: {{ $labels.job }}, cluster: {{ $labels.cluster }}, platform: {{ $labels.platform }}) is unreachable.'
          value: '{{ $values.B.Value | printf "%.0f" }} (1=up, 0=down)'
        labels:
          severity: critical
          domain: monitoring
          component: prometheus
          owner: platform
          actionable: 'true'
        noDataState: NoData
        execErrState: Error
    - orgId: 1
      name: Application Services
      folder: Applications
      interval: 2m
      rules:
      - uid: traefik_high_error_rate
        title: Traefik Service High Error Rate
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: (100 * sum by (cluster, service) (rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum by (cluster, service) (rate(traefik_service_requests_total[5m]))) and on (cluster, service) (sum by (cluster, service) (increase(traefik_service_requests_total[5m])) >= 20)
            instant: true
            range: false
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: mean
            refId: B
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
            conditions:
            - evaluator:
                params:
                - 10
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
        for: 5m
        annotations:
          summary: High HTTP 5xx rate on {{ $labels.service }}
          description: 'Traefik service {{ $labels.service }} has exceeded 10% HTTP 5xx responses with at least 20 requests per 5 minutes, sustained for 5 minutes.'
          value: '{{ $values.B.Value | printf "%.2f" }}%'
        labels:
          severity: warning
          domain: applications
          component: traefik
          owner: platform
          actionable: 'true'
        noDataState: OK
        execErrState: Error
      - uid: traefik_service_latency_high
        title: Traefik Service High Latency
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: histogram_quantile(0.95, sum by (le, cluster, service) (rate(traefik_service_request_duration_seconds_bucket[5m]))) and on (cluster, service) (sum by (cluster, service) (increase(traefik_service_request_duration_seconds_count[5m])) >= 50)
            instant: true
            range: false
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            refId: B
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
            conditions:
            - evaluator:
                params:
                - 2
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
        for: 10m
        annotations:
          summary: High p95 latency on {{ $labels.service }}
          description: 'Traefik service {{ $labels.service }} has exceeded 2 seconds p95 latency with at least 50 requests per 5 minutes, sustained for 10 minutes.'
          value: '{{ $values.B.Value | printf "%.3f" }} seconds p95'
        labels:
          severity: warning
          domain: applications
          component: traefik
          owner: platform
          actionable: 'true'
        noDataState: OK
        execErrState: Error
      - uid: authentik_worker_absent
        title: Authentik Worker Absent
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            expr: sum by (cluster) (authentik_tasks_workers) or vector(0)
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: mean
            refId: B
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
            conditions:
            - evaluator:
                params:
                - 0.5
                type: lt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
        for: 5m
        annotations:
          summary: 'Authentik Workers: {{ $values.B.Value | printf "%.0f" }}'
          description: Number of active Authentik workers is {{ $values.B.Value | printf
            "%.0f" }}.
          value: '{{ $values.B.Value | printf "%.0f" }} workers'
        labels:
          severity: critical
          domain: applications
          component: authentik
          owner: platform
          actionable: 'true'
        noDataState: NoData
        execErrState: Error
    - orgId: 1
      name: Cloudflare Tunnel
      folder: Applications
      interval: 2m
      rules:
      - uid: cloudflared_tunnel_disconnected
        title: Cloudflare Tunnel Disconnected
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: cloudflared_tunnel_ha_connections
            instant: true
            range: false
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            refId: B
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
            conditions:
            - evaluator:
                params:
                - 1
                type: lt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
        for: 2m
        annotations:
          summary: Cloudflare tunnel disconnected on {{ $labels.pod }}
          description: 'Cloudflared on {{ $labels.pod }} ({{ $labels.instance }}) has had zero HA connections for at least 2 minutes.'
          value: '{{ $values.B.Value | printf "%.0f" }} HA connections'
        labels:
          severity: critical
          domain: applications
          component: cloudflared
          owner: platform
          actionable: 'true'
        noDataState: NoData
        execErrState: Error
      - uid: cloudflared_request_errors_high
        title: Cloudflare Tunnel Request Errors
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: sum by (cluster, namespace, node, pod, instance) (increase(cloudflared_tunnel_request_errors[5m]))
            instant: true
            range: false
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            refId: B
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
            conditions:
            - evaluator:
                params:
                - 5
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
        for: 2m
        annotations:
          summary: Cloudflare tunnel request errors on {{ $labels.pod }}
          description: 'Cloudflared on {{ $labels.pod }} has recorded more than 5 tunnel request errors within 5 minutes.'
          value: '{{ $values.B.Value | printf "%.0f" }} errors/5m'
        labels:
          severity: warning
          domain: applications
          component: cloudflared
          owner: platform
          actionable: 'true'
        noDataState: OK
        execErrState: Error
      - uid: cloudflared_origin_conn_errors_high
        title: Cloudflare Origin Connection Failures
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: sum by (cluster, namespace, node, pod, instance) (increase(cloudflared_proxy_connect_streams_errors[5m]))
            instant: true
            range: false
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            refId: B
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
            conditions:
            - evaluator:
                params:
                - 5
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
        for: 2m
        annotations:
          summary: Cloudflare origin connection failures on {{ $labels.pod }}
          description: 'Cloudflared on {{ $labels.pod }} has recorded more than 5 origin connection failures within 5 minutes.'
          value: '{{ $values.B.Value | printf "%.0f" }} failures/5m'
        labels:
          severity: critical
          domain: applications
          component: cloudflared
          owner: platform
          actionable: 'true'
        noDataState: OK
        execErrState: Error
      - uid: cloudflared_origin_latency_high
        title: Cloudflare Origin Connection Latency High
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: histogram_quantile(0.95, sum by (le, cluster, namespace, node, pod, instance) (rate(cloudflared_proxy_connect_latency_bucket[5m]))) and on (cluster, namespace, node, pod, instance) (sum by (cluster, namespace, node, pod, instance) (increase(cloudflared_proxy_connect_latency_count[5m])) >= 20)
            instant: true
            range: false
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            refId: B
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
            conditions:
            - evaluator:
                params:
                - 1
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
        for: 10m
        annotations:
          summary: High Cloudflare origin latency on {{ $labels.pod }}
          description: 'Cloudflared on {{ $labels.pod }} has exceeded 1 second p95 origin connection latency with at least 20 connection attempts per 5 minutes, sustained for 10 minutes.'
          value: '{{ $values.B.Value | printf "%.3f" }} seconds p95'
        labels:
          severity: warning
          domain: applications
          component: cloudflared
          owner: platform
          actionable: 'true'
        noDataState: OK
        execErrState: Error
      - uid: cloudflared_rpc_failures_high
        title: Cloudflare RPC Failures
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            editorMode: code
            expr: sum by (cluster, namespace, node, pod, instance) (increase(cloudflared_rpc_client_failures[5m]))
            instant: true
            range: false
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: last
            refId: B
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
            conditions:
            - evaluator:
                params:
                - 5
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
        for: 2m
        annotations:
          summary: Cloudflare RPC failures on {{ $labels.pod }}
          description: 'Cloudflared on {{ $labels.pod }} has recorded more than 5 RPC failures within 5 minutes.'
          value: '{{ $values.B.Value | printf "%.0f" }} failures/5m'
        labels:
          severity: warning
          domain: applications
          component: cloudflared
          owner: platform
          actionable: 'true'
        noDataState: OK
        execErrState: Error
