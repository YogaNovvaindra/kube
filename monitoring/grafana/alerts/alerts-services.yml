apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-services
  namespace: monitoring
data:
  alerts-services.yaml: |
    apiVersion: 1
    groups:
    - orgId: 1
      name: Monitoring Availability
      folder: Infrastructure
      interval: 1m
      rules:
      - uid: target_down
        title: Prometheus Target Down
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            expr: up
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: mean
            refId: B
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
            conditions:
            - evaluator:
                params:
                - 0.5
                type: lt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
        for: 5m
        annotations:
          summary: 'Target Down: {{ $labels.job }}'
          description: 'Monitoring target {{ $labels.instance }} (job: {{ $labels.job
            }}) is unreachable.'
          value: '{{ $values.B.Value | printf "%.0f" }} (1=up, 0=down)'
        labels:
          severity: critical
          domain: monitoring
          component: prometheus
          owner: platform
          actionable: 'true'
        noDataState: NoData
        execErrState: Error
    - orgId: 1
      name: Application Services
      folder: Applications
      interval: 1m
      rules:
      - uid: traefik_high_error_rate
        title: Traefik High Error Rate
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            expr: (sum(rate(traefik_entrypoint_requests_total{code=~"5.."}[5m])) or vector(0))
              / sum(rate(traefik_entrypoint_requests_total[5m])) * 100
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: mean
            refId: B
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
            conditions:
            - evaluator:
                params:
                - 5
                type: gt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
        for: 5m
        annotations:
          summary: High HTTP 5xx Error Rate
          description: 'Traefik is reporting a high rate of 5xx errors (Current: {{ $values.B.Value
            | printf "%.2f" }}%).'
          value: '{{ $values.B.Value | printf "%.2f" }}%'
        labels:
          severity: warning
          domain: applications
          component: traefik
          owner: platform
          actionable: 'true'
        noDataState: NoData
        execErrState: Error
      - uid: authentik_worker_absent
        title: Authentik Worker Absent
        condition: C
        data:
        - refId: A
          relativeTimeRange:
            from: 300
            to: 0
          datasourceUid: prometheus
          model:
            datasource:
              type: prometheus
              uid: prometheus
            expr: sum(authentik_tasks_workers) or vector(0)
            refId: A
        - refId: B
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: A
            reducer: mean
            refId: B
            type: reduce
        - refId: C
          datasourceUid: __expr__
          model:
            datasource:
              type: __expr__
              uid: __expr__
            expression: B
            refId: C
            type: threshold
            conditions:
            - evaluator:
                params:
                - 0.5
                type: lt
              operator:
                type: and
              query:
                params:
                - C
              reducer:
                params: []
                type: last
              type: query
        for: 5m
        annotations:
          summary: 'Authentik Workers: {{ $values.B.Value | printf "%.0f" }}'
          description: Number of active Authentik workers is {{ $values.B.Value | printf
            "%.0f" }}.
          value: '{{ $values.B.Value | printf "%.0f" }} workers'
        labels:
          severity: critical
          domain: applications
          component: authentik
          owner: platform
          actionable: 'true'
        noDataState: NoData
        execErrState: Error
