apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-templates
  namespace: monitoring
data:
  alerts-templates.yaml: |
    apiVersion: 1
    templates:
      - name: discord
        template: |
          {{- define "__severity_icon" -}}
            {{- if eq .Labels.severity "critical" -}}🔴
            {{- else if eq .Labels.severity "warning" -}}🟡
            {{- else if eq .Labels.severity "info" -}}🔵
            {{- else -}}⚪
            {{- end -}}
          {{- end -}}

          {{- define "__discord_alert" -}}
          {{ template "__severity_icon" . }} **{{ .Labels.alertname }}**
          > 📋 **Summary**: {{ .Annotations.summary | default "No summary provided" }}
          > 📝 **Description**: {{ .Annotations.description | default "No description provided" }}
          {{- if .Annotations.value }}
          > 📊 **Value**: {{ .Annotations.value }}
          {{- end }}
          > 🏷️ **Severity**: `{{ .Labels.severity | default "unknown" }}`
          {{- if .Labels.instance }}
          > 🖥️ **Instance**: `{{ .Labels.instance }}`
          {{- end }}
          {{- if .Labels.job }}
          > ⚙️ **Job**: `{{ .Labels.job }}`
          {{- end }}
          > 🕐 **Started**: {{ .StartsAt.UTC.Format "2006-01-02 15:04:05 UTC" }}
          {{- end }}

          {{- define "discord.title" -}}
          {{- if gt (len .Alerts.Firing) 0 -}}🔥 FIRING: {{ len .Alerts.Firing }}{{- end -}}
          {{- if and (gt (len .Alerts.Firing) 0) (gt (len .Alerts.Resolved) 0) -}} | {{- end -}}
          {{- if gt (len .Alerts.Resolved) 0 -}}✅ RESOLVED: {{ len .Alerts.Resolved }}{{- end -}}
          {{- with .GroupLabels.SortedPairs }} — {{ .Values | join ", " }}{{- end -}}
          {{- end }}

          {{- define "discord.message" -}}
          {{- if gt (len .Alerts.Firing) 0 }}
          ## 🔥 Firing Alerts
          {{ range .Alerts.Firing -}}
          {{ template "__discord_alert" . }}
          {{ end -}}
          {{- end -}}
          {{- if gt (len .Alerts.Resolved) 0 }}
          ## ✅ Resolved Alerts
          {{ range .Alerts.Resolved -}}
          {{ template "__discord_alert" . }}
          {{ end -}}
          {{- end -}}
          {{- end }}
