apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-templates
  namespace: monitoring
data:
  alerts-templates.yaml: |
    apiVersion: 1
    templates:
      - name: discord
        template: |
          {{ define "__severity_icon" -}}
            {{- if eq .Labels.severity "critical" -}}🔴
            {{- else if eq .Labels.severity "warning" -}}🟡
            {{- else if eq .Labels.severity "info" -}}🔵
            {{- else -}}⚪
            {{- end -}}
          {{- end }}

          {{ define "__discord_alert" -}}
          {{ template "__severity_icon" . }} **{{ .Labels.alertname }}**
          {{ if .Annotations.summary }}> 📋 **Summary**: {{ .Annotations.summary }}{{ end }}
          {{ if .Annotations.description }}> 📝 **Description**: {{ .Annotations.description }}{{ end }}
          {{ if .Annotations.value }}> 📊 **Value**: {{ .Annotations.value }}{{ end }}
          > 🏷️ **Severity**: `{{ if .Labels.severity }}{{ .Labels.severity }}{{ else }}unknown{{ end }}`
          {{ if .Labels.instance }}> 🖥️ **Instance**: `{{ .Labels.instance }}`{{ end }}
          {{ if .Labels.job }}> ⚙️ **Job**: `{{ .Labels.job }}`{{ end }}
          > 🕐 **Started**: {{ .StartsAt }}
          {{- end }}

          {{ define "discord.title" -}}
          [{{ if gt (len .Alerts.Firing) 0 }}🔥 FIRING: {{ len .Alerts.Firing }}{{ end }}{{ if and (gt (len .Alerts.Firing) 0) (gt (len .Alerts.Resolved) 0) }} | {{ end }}{{ if gt (len .Alerts.Resolved) 0 }}✅ RESOLVED: {{ len .Alerts.Resolved }}{{ end }}]
          {{- end }}

          {{ define "discord.message" -}}
          {{ if gt (len .Alerts.Firing) 0 -}}
          ## 🔥 Firing Alerts
          {{ range .Alerts.Firing }}
          {{ template "__discord_alert" . }}
          {{ end }}
          {{- end }}
          {{ if gt (len .Alerts.Resolved) 0 -}}
          ## ✅ Resolved Alerts
          {{ range .Alerts.Resolved }}
          {{ template "__discord_alert" . }}
          {{ end }}
          {{- end }}
          {{- end }}
