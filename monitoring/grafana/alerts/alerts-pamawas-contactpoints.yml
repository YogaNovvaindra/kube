apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-pamawas-contactpoints
  namespace: monitoring
data:
  alerts-pamawas-contactpoints.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: pamawas-ingest
        receivers:
          - uid: pamawas-ingest-webhook
            type: webhook
            disableResolveMessage: false
            settings:
              url: http://pamawas-ingest.pamawas.svc.cluster.local:8080/webhook/grafana
              httpMethod: POST