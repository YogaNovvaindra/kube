---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-env
  namespace: tools
  labels:
    app: hermes
data:
  HERMES_DASHBOARD: "1"
  HERMES_DASHBOARD_PUBLIC_URL: "https://hermes.ygnv.my.id"
  HERMES_DASHBOARD_OIDC_ISSUER: "https://auth.ygnv.my.id/application/o/hermes/"
  HERMES_DASHBOARD_OIDC_SCOPES: "openid profile email"
  PORT: "8642"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: tools
  labels:
    app: hermes
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: hermes
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: hermes
        image: reg.ygnv.my.id/docker/nousresearch/hermes-agent:v2026.8.3
        imagePullPolicy: IfNotPresent
        args: ["gateway", "run"]
        ports:
        - containerPort: 8642
          name: http
        - containerPort: 9119
          name: dashboard
        envFrom:
        - configMapRef:
            name: hermes-env
        - secretRef:
            name: hermes-cred
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: hermes-data
          mountPath: /opt/data
      volumes:
      - name: hermes-data
        hostPath:
          path: /mnt/cephfs/docker/tools/hermes
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: tools
  labels:
    app: hermes
spec:
  selector:
    app: hermes
  ports:
  - port: 8642
    targetPort: http
    name: http
  - port: 9119
    targetPort: dashboard
    name: dashboard
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes
  namespace: tools
  labels:
    app: hermes
spec:
  entryPoints:
    - http
    - https
  routes:
    - match: Host(`hermes.ygnv.my.id`)
      kind: Rule
      services:
        - name: hermes
          port: 9119
  tls: {}