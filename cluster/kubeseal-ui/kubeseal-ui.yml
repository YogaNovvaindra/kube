---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeseal-ui-api
  namespace: cluster
  labels:
    app: kubeseal-ui
    app.kubernetes.io/component: api

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeseal-ui-api-controller-key
  namespace: cluster
  labels:
    app: kubeseal-ui
    app.kubernetes.io/component: api
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeseal-ui-api-controller-key
  namespace: cluster
  labels:
    app: kubeseal-ui
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeseal-ui-api-controller-key
subjects:
  - kind: ServiceAccount
    name: kubeseal-ui-api
    namespace: cluster

---
apiVersion: v1
kind: Service
metadata:
  name: kubeseal-ui-api
  namespace: cluster
  labels:
    app: kubeseal-ui
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: kubeseal-ui
    app.kubernetes.io/component: api

---
apiVersion: v1
kind: Service
metadata:
  name: kubeseal-ui
  namespace: cluster
  labels:
    app: kubeseal-ui
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app: kubeseal-ui
    app.kubernetes.io/component: ui

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeseal-ui-api
  namespace: cluster
  labels:
    app: kubeseal-ui
    app.kubernetes.io/component: api
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
    keel.sh/pollSchedule: "@every 1h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeseal-ui
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app: kubeseal-ui
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: kubeseal-ui-api
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/kubeseal-ui/api:dev
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KUBESEAL_API_PORT
              value: "8080"
            - name: KUBESEAL_CERT_URL
              value: "http://sealed-secrets-controller.cluster.svc.cluster.local:8080/v1/cert.pem"
            - name: LOG_LEVEL
              value: "info"
            - name: OIDC_ISSUER
              value: "https://auth.ygnv.my.id/application/o/kubeseal-ui/"
            - name: OIDC_SCOPES
              value: "openid profile email kubeseal_mapping"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: kubeseal-cred
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubeseal-cred
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_REDIRECT_URL
              value: "https://sealer.ygnv.my.id/api/v1/auth/callback"
            - name: CSRF_TRUSTED_ORIGINS
              value: "https://sealer.ygnv.my.id"
            - name: SESSION_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: kubeseal-cred
                  key: SESSION_SIGNING_KEY
            - name: ENABLE_DECRYPT
              value: "true"
            - name: KUBESEAL_CONTROLLER_NAMESPACE
              value: "cluster"
            - name: KUBESEAL_ACTIVE_KEY_LABEL
              value: "sealedsecrets.bitnami.com/sealed-secrets-key"
            - name: GITOPS_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: ""
            - name: OTEL_SERVICE_NAME
              value: "kubeseal-ui-api"
            - name: OTEL_SERVICE_VERSION
              value: "dev"
            - name: OTEL_DEPLOYMENT_ENVIRONMENT
              value: "cluster"
            - name: GITOPS_AUTHOR_NAME
              value: "kubeseal-ui"
            - name: GITOPS_AUTHOR_EMAIL
              value: "kubeseal-ui@ygnv.my.id"
            - name: GITOPS_WORKTREE_DIR
              value: "/tmp/kubeseal-ui/gitops"
            - name: GITOPS_CREDENTIAL_REFS
              valueFrom:
                secretKeyRef:
                  name: kubeseal-cred
                  key: GITOPS_CREDENTIAL_REFS
            - name: GITOPS_NAMESPACES
              value: "*:YogaNovvaindra/kube:main:{namespace}/{name}-cred.yml:github:direct"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: worktree
              mountPath: /tmp/kubeseal-ui
            - name: git-credentials
              mountPath: /var/run/secrets/git/platform
              readOnly: true
      volumes:
        - name: worktree
          emptyDir:
            sizeLimit: 1Gi
        - name: git-credentials
          secret:
            secretName: kubeseal-cred
      terminationGracePeriodSeconds: 30

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeseal-ui
  namespace: cluster
  labels:
    app: kubeseal-ui
    app.kubernetes.io/component: ui
  annotations:
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/match-tag: "true"
    keel.sh/pollSchedule: "@every 1h"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubeseal-ui
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        app: kubeseal-ui
        app.kubernetes.io/component: ui
    spec:
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ghcr.io/kubeseal-ui/frontend:dev
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30